{% extends 'base.html' %}{% block content %}<div class="card"><h2>Report lost or found item</h2><form method="post" enctype="multipart/form-data"><label>Report type</label><select name="report_type"><option>Lost</option><option>Found</option></select><label>Item name</label><input name="item_name" required><label>Category</label><select name="category_id">{% for c in categories %}<option value="{{ c.category_id }}">{{ c.category_name }}</option>{% endfor %}</select><label>Location</label><select name="location_id">{% for l in locations %}<option value="{{ l.location_id }}">{{ l.location_name }}</option>{% endfor %}</select><label>Date</label><input type="date" name="item_date"><label>Description</label><textarea name="description" rows="4"></textarea><label>Item photo (JPG, PNG, WEBP or GIF; max 5 MB)</label><input type="file" name="item_image" accept="image/png,image/jpeg,image/webp,image/gif"><button>Save report</button></form></div>{% endblock %}
